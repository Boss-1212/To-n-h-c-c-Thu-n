<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Toán Cùng Cô Tâm</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 450px;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            margin-bottom: 15px;
        }
        h1 {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        p.bio {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .link-btn {
            display: block;
            background: #ffffff;
            color: #333;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            border: 2px solid #eef2f5;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .link-btn:hover {
            background: #6c5ce7;
            color: #ffffff;
            border-color: #6c5ce7;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #a0aec0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Thay link ảnh đại diện của bạn vào thuộc tính src dưới đây -->
        <img src="https://images.unsplash.com/photo-1544717305-2782549b5136?w=300" alt="Ảnh đại diện" class="avatar">
        
        <h1>Học Toán Cùng Cô Tâm</h1>
        <p class="bio">Chia sẻ kiến thức, tài liệu ôn thi và bí quyết học giỏi Toán dành cho học sinh các cấp.</p>

        <div class="links-container">
            <!-- Thay các đường link tương ứng vào phần href="..." -->
            <a href="https://zalo.me" target="_blank" class="link-btn">💬 Nhóm Học Tập Zalo Miễn Phí</a>
            <a href="https://youtube.com" target="_blank" class="link-btn">📺 Kênh Bài Giảng YouTube</a>
            <a href="https://drive.google.com" target="_blank" class="link-btn">📂 Kho Đề Thi & Tài Liệu PDF</a>
            <a href="https://facebook.com" target="_blank" class="link-btn">📘 Fanpage Facebook</a>
        </div>

        <div class="footer">
            © Học Toán Cùng Cô Tâm
        </div>
    </div>

</body>
</html>
